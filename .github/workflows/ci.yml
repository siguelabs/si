name: CI

on:
  # Pull requests cover feature branches; pushes to main verify merged code.
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # This package has no dependencies or lockfile; nothing needs installing.
      - run: npm --ignore-scripts test
      - run: python3 -m unittest discover -s tests -v
      - name: Pack and install offline
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: node .github/scripts/pack-smoke.mjs "$RUNNER_TEMP/npm-package"
      - name: Upload tested npm tarball
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/
          if-no-files-found: error
          overwrite: true
          retention-days: 14
