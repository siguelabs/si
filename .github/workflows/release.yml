name: Publish npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.repository == 'siguelabs/si'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-package
      - name: Verify and publish the tested tarball
        working-directory: npm-package
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const [major, minor, patch] = require("node:child_process").execFileSync("npm", ["--version"], {encoding: "utf8"}).trim().split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error("npm >=11.5.1 is required for OIDC");'
          sha256sum --check SHA256SUMS
          archives=(*.tgz)
          test "${#archives[@]}" -eq 1
          tar -xOf "${archives[0]}" package/package.json > "$RUNNER_TEMP/published-package.json"
          node -e 'const fs = require("node:fs"); const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/published-package.json")); if (p.name !== "si-overnight" || !/^v\d+\.\d+\.\d+$/.test(process.env.GITHUB_REF_NAME) || process.env.GITHUB_REF_NAME !== `v${p.version}`) throw new Error("Release tag must match the stable package version");'
          npm publish "${archives[0]}" --ignore-scripts --provenance --access public
